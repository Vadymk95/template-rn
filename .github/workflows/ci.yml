name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Typecheck, lint, test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Depth 2: lock:age (inside verify:ci) compares the lockfile with HEAD~1, and a
                  # private fork's persist-credentials: false means it cannot fetch the parent itself.
                  fetch-depth: 2
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            # `.nvmrc` holds the floor (24.11), so setup-node installs a 24.11.x, and
            # every 24.11.x bundles an npm 11.6.x, older than 11.14.0. That npm has the
            # long-standing cross-platform optional-binaries bug (npm/cli#4828): lock
            # files generated on macOS arm64 fail Linux CI with EUSAGE "Missing:
            # <pkg>-linux-x64-gnu from lock file" for native bindings (@expo/ngrok-bin,
            # @unrs/resolver-binding, etc.). Both that bug and a later peerOptional
            # regression (npm/cli#9249, 2026-04-17: peerOptional deps marked extraneous
            # and removed, present in the npm 11.12.1 that Node 24.15.0 bundles) are
            # fully restored in npm 11.14.0 (2026-05-06) via arborist 9.5.0. The step
            # exists only because `.nvmrc` sits at the floor: Node 24.18.0 is the first
            # release that bundles npm >= 11.14.0 (11.16.0), so once `.nvmrc` is raised
            # to 24.18 or later this step and its pin can be deleted. Pin to ^11.14.0
            # explicitly — npm@latest would track future majors that may regress again.
            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            # `.npmrc` sets ignore-scripts=true as a supply-chain guard; repeating
            # it on the command line means a change to that file cannot silently
            # re-enable install scripts in CI.
            - name: Install
              run: npm ci --ignore-scripts

            # ONE step over the same script husky pre-push runs. A new check belongs
            # in `verify` (offline) or `verify:ci` (needs the network) — never only
            # here, or a green local gate stops meaning a green pipeline.
            - name: Verify contract (audit gate, lock age, typecheck, lint, format, coverage)
              run: npm run verify:ci

            # Expo doctor checks live external SDK/package state and can go red with
            # no code change (drift). Advisory, not a PR gate (tooling /consilium
            # 2026-07-21): it still runs and surfaces in the log, but does not block.
            - name: Expo doctor (SDK health, advisory)
              run: npm run doctor
              continue-on-error: true

    # The Hermes bundle budget (`perf:check`: a full `expo export` for both platforms, compared
    # with scripts/perf-baseline.json) used to run only when someone remembered to. It lives in
    # its own job rather than in `verify` because the export is the heaviest single stage the
    # repo has and the tier law keeps heavy stages out of the push gate; the job is listed in
    # scripts/gate-tiers.json ci.allowedRunSteps with that reason. Run the same script locally
    # with `npm run perf:check`. Not a required status check in .github/ruleset.json.
    bundle-budget:
        name: Hermes bundle budget
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            # Same npm pin and reason as the `verify` job above.
            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            - name: Install
              run: npm ci --ignore-scripts

            - name: Bundle budget (Hermes bytecode, both platforms)
              run: npm run perf:check

    # NO dependency-review job, and this is a measurement rather than an omission. It was here, and
    # it could never pass: the action answers "Dependency review is not supported on this repository.
    # Please ensure that Dependency graph is enabled", and the Dependency graph is not available to
    # this private repository on this plan - enabling it through the API on 2026-09-13 changed
    # nothing and the rerun failed identically.
    #
    # It had been red since the day it was added, and nobody saw it, because every change went
    # straight to master where pull-request jobs never run. The first pull request this repository
    # ever opened surfaced it in five seconds. A check that cannot pass is worse than no check: it
    # trains everyone to read red as normal.
    #
    # Bring it back the day the repository becomes public, or the plan gains the Dependency graph.
    # The job body was four steps and is one `git revert` away; nothing about it was wrong except
    # that the platform underneath it was not there.
