version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      commit-message:
          prefix: chore(deps)
      # Dependency cooldown: let fresh releases soak before PRs are opened
      # (supply-chain worm waves 2025-2026 were typically remediated within days).
      cooldown:
          default-days: 7
          semver-major-days: 14
      # One weekly PR for every minor and patch update, production and development alike: two groups
      # both rewrite package-lock.json, so the second one conflicted after the first merged (2026-09-27).
      # A major update still arrives as its own PR, where it gets its own look.
      groups:
          minor-and-patch:
              update-types: ['minor', 'patch']
      # The Expo SDK owns the native stack versions — `npx expo install --fix`
      # is the only valid updater for these; Dependabot bumps would break the
      # Expo Go / jest-expo pairing. See AGENTS.md "Version holds".
      ignore:
          - dependency-name: 'expo'
          - dependency-name: 'expo-*'
          - dependency-name: '@expo/*'
          - dependency-name: 'babel-preset-expo'
          - dependency-name: 'jest-expo'
          - dependency-name: 'eslint-config-expo'
          - dependency-name: 'react'
          - dependency-name: 'react-dom'
          - dependency-name: 'react-native'
          - dependency-name: 'react-native-*'
          - dependency-name: '@react-native/*'
          - dependency-name: '@react-native-async-storage/*'
          # jest-expo@57.0.5 depends on babel-jest ^29.2.1 (read 2026-10-07)
          - dependency-name: 'jest'
            versions: ['>=30']
          - dependency-name: '@types/jest'
            versions: ['>=30']
          # babel-jest@29 (pulled by jest-expo@57) peers @babel/core ^7.8.0, so
          # Babel 8 arrives together with Jest 30, never on its own. Drop this
          # ignore in the same commit that lifts the jest hold above.
          - dependency-name: '@babel/core'
            versions: ['>=8']
          # nativewind@4.2.7 (still latest, 2026-10-07) calls tailwindcss/lib/ modules
          # that tailwindcss 4 does not ship
          - dependency-name: 'tailwindcss'
            versions: ['>=4']
          # typescript-eslint@8.71.1 peers typescript <6.1.0 (read 2026-10-07); TS is also SDK-paired
          - dependency-name: 'typescript'
            versions: ['>=6.1']
          # test-renderer@1.3.0 pulls react-reconciler@0.34, which peers react ^19.3.0; the SDK pins
          # react 19.2.3 (read 2026-10-07). Lift with the SDK that pins react 19.3.
          - dependency-name: 'test-renderer'
            versions: ['>=1.3']
          # The types stay level with the SDK-pinned react@19.2.3: @types/react@19.3
          # declares ViewTransition, which that runtime does not export (2026-10-07).
          # Lift with the SDK that pins react 19.3.
          - dependency-name: '@types/react'
            versions: ['>=19.3']
          # ESLint: the repo IS on 10.x. The floor is >=11 so patches and minors
          # inside 10 still arrive; a major would again outrun the plugin peers
          # that `overrides` map to `$eslint`.
          - dependency-name: 'eslint'
            versions: ['>=11']
          - dependency-name: '@eslint/js'
            versions: ['>=11']

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      commit-message:
          prefix: ci(deps)
      groups:
          actions:
              patterns: ['*']
