version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      commit-message:
          prefix: chore(deps)
      # Dependency cooldown: let fresh releases soak before PRs are opened
      # (supply-chain worm waves 2025-2026 were typically remediated within days).
      cooldown:
          default-days: 7
          semver-major-days: 14
      # One weekly PR for every minor and patch update, production and development alike: two groups
      # both rewrite package-lock.json, so the second one conflicted after the first merged (2026-09-27).
      # A major update still arrives as its own PR, where it gets its own look.
      groups:
          minor-and-patch:
              update-types: ['minor', 'patch']
      # Every ignore below is a version hold: the reason, the lift condition and the evidence live in
      # scripts/version-holds.json, which `verify` checks against this file. Edit them together.
      ignore:
          # The Expo SDK owns the native stack: `npx expo install --fix` is the only valid updater.
          - dependency-name: 'expo'
          - dependency-name: 'expo-*'
          - dependency-name: '@expo/*'
          - dependency-name: 'babel-preset-expo'
          - dependency-name: 'jest-expo'
          - dependency-name: 'eslint-config-expo'
          - dependency-name: 'react'
          - dependency-name: 'react-dom'
          - dependency-name: 'react-native'
          - dependency-name: 'react-native-*'
          - dependency-name: '@react-native/*'
          - dependency-name: '@react-native-async-storage/*'
          - dependency-name: 'jest'
            versions: ['>=30']
          - dependency-name: '@types/jest'
            versions: ['>=30']
          - dependency-name: '@babel/core'
            versions: ['>=8']
          - dependency-name: 'tailwindcss'
            versions: ['>=4']
          - dependency-name: 'typescript'
            versions: ['>=6.1']
          - dependency-name: 'test-renderer'
            versions: ['>=1.3']
          - dependency-name: '@types/react'
            versions: ['>=19.3']
          - dependency-name: 'eslint'
            versions: ['>=11']
          - dependency-name: '@eslint/js'
            versions: ['>=11']

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      commit-message:
          prefix: ci(deps)
      groups:
          actions:
              patterns: ['*']
